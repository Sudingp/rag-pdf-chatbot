# Prometheus config used inside the cluster (a ConfigMap generated by k8s/kustomization.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ragbot
    static_configs:
      - targets: ["ragbot:9100"]        # the ragbot Service, metrics port
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
